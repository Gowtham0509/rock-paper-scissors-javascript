<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>ROCK, PAPER AND SCISSORS</h1>
    </header>
    <div>
        <button class="resetBtn">Reset</button>
    </div>
    <div id="btns">
        <button class="btn">Rock</button>
        <button class="btn">Paper</button>
        <button class="btn">Scissors</button>
    </div>
    <div>
        <div class="humanChoice"></div>
        <div class="computerChoice"></div>
    </div>
    <div class="results">
        
        <div class="humanScoreDisplay"></div>
        <div class="computerScoreDisplay"></div>
        <div class="winner"></div>
    </div>

</body>
</html>
